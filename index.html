<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Board Dash</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', sans-serif;
    height: 100%;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
  }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 10px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 20px; font-weight: 700;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6); pointer-events: none; letter-spacing: 1px;
  }
  #controls {
    position: absolute; bottom: 16px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 20px; pointer-events: none;
  }
  .ctrl-btn {
    pointer-events: auto; width: 108px; height: 56px; border-radius: 14px;
    border: none; font-size: 16px; font-weight: 800; letter-spacing: 1px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4); -webkit-tap-highlight-color: transparent;
  }
  #jumpBtn { background: linear-gradient(135deg,#9fd3ff,#4a90d9); color: #0b2545; }
  #boostBtn { background: linear-gradient(135deg,#ffd23f,#ff8a3d); color: #1a1a2e; }
  .ctrl-btn:active { transform: scale(0.94); }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff;
    background: rgba(10,10,20,0.7); text-align: center; gap: 14px;
    z-index: 20;
  }
  #overlay h1 { margin: 0; font-size: 30px; letter-spacing: 1px; text-shadow: 0 3px 10px rgba(0,0,0,0.6); }
  #overlay p { margin: 0; opacity: 0.85; font-size: 14px; max-width: 300px; }
  #idleWrap {
    width: 34vh;
    height: 34vh;
    max-width: 220px;
    max-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.5));
  }
  #idleWrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: -webkit-optimize-contrast;
  }
  #overlay button.startBtn {
    margin-top: 8px; padding: 12px 28px; font-size: 17px; font-weight: 700;
    border: none; border-radius: 30px; background: linear-gradient(135deg,#f5c518,#f28c18);
    color: #1a1a2e; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }
  #overlay button.startBtn:active { transform: scale(0.96); }
  #rotateOverlay {
    position: fixed; inset: 0; z-index: 999;
    background: #05050c;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    gap: 16px;
  }
  #rotateOverlay .icon {
    font-size: 54px;
    animation: rotatePulse 1.4s ease-in-out infinite;
  }
  #rotateOverlay p { max-width: 260px; opacity: 0.85; font-size: 15px; margin: 0; }
  @keyframes rotatePulse {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">0</div>
  <div id="controls">
    <button id="jumpBtn" class="ctrl-btn">ҮСРЭХ</button>
    <button id="boostBtn" class="ctrl-btn">BOOST</button>
  </div>
  <div id="overlay">
    <div id="idleWrap"><img id="idleImg" src="idle/01.png" alt="character"></div>
    <h1>BOARD DASH</h1>
    <p>Нисдэг board дээр гүйж яв. ҮСРЭХ дар — үсэрнэ. BOOST-ыг барь — хурдасаад дээш хөвнө.</p>
    <button id="startBtn" class="startBtn">PLAY</button>
  </div>
</div>
<div id="rotateOverlay">
  <div class="icon">📱</div>
  <p>Тоглохын тулд утсаа хэвтээ (landscape) байрлалд эргүүлнэ үү</p>
</div>
<script>
const wrap = document.getElementById('wrap');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const jumpBtn = document.getElementById('jumpBtn');
const boostBtn = document.getElementById('boostBtn');
const overlayTitle = overlay.querySelector('h1');
const overlayText = overlay.querySelector('p');
const rotateOverlay = document.getElementById('rotateOverlay');
const idleImg = document.getElementById('idleImg');

// --- Home screen idle animation (21 frames, plays only while the menu/overlay is visible) ---
const IDLE_FRAME_COUNT = 21;
const IDLE_FRAME_MS = 100;
const idleFrames = [];
for (let i = 1; i <= IDLE_FRAME_COUNT; i++) {
  const img = new Image();
  img.src = 'idle/' + String(i).padStart(2, '0') + '.png';
  idleFrames.push(img);
}
let idleFrameIndex = 0;
let idleTimerId = null;
function startIdleAnim() {
  if (idleTimerId) return;
  idleFrameIndex = 0;
  idleImg.src = idleFrames[0].src;
  idleTimerId = setInterval(() => {
    idleFrameIndex = (idleFrameIndex + 1) % IDLE_FRAME_COUNT;
    idleImg.src = idleFrames[idleFrameIndex].src;
  }, IDLE_FRAME_MS);
}
function stopIdleAnim() {
  if (idleTimerId) { clearInterval(idleTimerId); idleTimerId = null; }
}

// --- orientation gate: block play in portrait, prompt to rotate ---
function checkOrientation() {
  const isPortrait = window.innerHeight > window.innerWidth;
  rotateOverlay.style.display = isPortrait ? 'flex' : 'none';
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);
checkOrientation();

// --- fullscreen + landscape lock, triggered by user gesture ---
async function goFullscreenLandscape() {
  try {
    const el = document.documentElement;
    if (el.requestFullscreen) await el.requestFullscreen();
    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
  } catch (e) { /* fullscreen may be denied, ignore */ }
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape');
    }
  } catch (e) { /* not supported (e.g. iOS Safari) - user rotates manually */ }
}

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener('resize', resize);
resize();

// --- sprite image: put "sprite.png" in the SAME folder as this html file ---
const sprite = new Image();
sprite.src = "sprite.png";
// natural aspect ratio of the sprite (portrait image, taller than wide)
let spriteAR = 465 / 867; // width / height, fallback until image loads
sprite.addEventListener('load', () => {
  spriteAR = sprite.naturalWidth / sprite.naturalHeight;
});

// --- board image: put "board.png" in the SAME folder as this html file ---
const boardImg = new Image();
boardImg.src = "board.png";
let boardAR = 1423 / 661; // width / height, fallback until image loads
boardImg.addEventListener('load', () => {
  boardAR = boardImg.naturalWidth / boardImg.naturalHeight;
});

const GROUND_Y_RATIO = 0.72;
let W = window.innerWidth, H = window.innerHeight;
window.addEventListener('resize', () => { W = window.innerWidth; H = window.innerHeight; });

const GRAVITY = 2200;
const JUMP_VELOCITY = -820;
const BASE_SPEED = 420;
const BOOST_SPEED = 760;
const BOOST_LIFT = -600;
const PLAYER_H = 84;                 // fixed height, width derived from sprite's real aspect ratio
function playerW() { return PLAYER_H * spriteAR; }
function boardW() { return playerW() * 1.45; }   // board is noticeably wider than the sprite's feet
function boardH() { return boardW() / boardAR; }
// shared pivot: the point where the sprite's feet meet the board (both rotate around this)
function footPivot() {
  return { x: player.x + playerW()/2, y: player.y + PLAYER_H };
}

let player, world, obstacles, particles, score, best = 0, speed, running, gameOver, holdStart, boosting, groundY;
let spawnTimer = 0, nextSpawnGap = 900;

function resetGame() {
  groundY = H * GROUND_Y_RATIO;
  player = { x: W * 0.28, y: groundY - PLAYER_H, vy: 0, onGround: true, rot: 0 };
  world = { dist: 0 };
  obstacles = [];
  particles = [];
  score = 0;
  speed = BASE_SPEED;
  boosting = false;
  holdStart = 0;
  gameOver = false;
  running = false;
  spawnTimer = 0;
  nextSpawnGap = 900;
}

function spawnObstacle() {
  const kind = Math.random() < 0.55 ? 'spike' : 'block';
  if (kind === 'spike') {
    obstacles.push({ type: 'spike', x: W + 40, w: 34, h: 40 });
  } else {
    const h = 40 + Math.random() * 50;
    obstacles.push({ type: 'block', x: W + 40, w: 46, h });
  }
}

function doJump() {
  if (gameOver) { resetGame(); showStart(false); running = true; return; }
  if (!running) { running = true; return; }
  if (player.onGround) {
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
    spawnBurst(player.x + playerW()*0.3, player.y + PLAYER_H, 10);
  }
}

let boostHeld = false;
function startBoost() {
  if (gameOver) { resetGame(); showStart(false); running = true; return; }
  if (!running) { running = true; }
  boostHeld = true;
  holdStart = performance.now();
}
function endBoost() { boostHeld = false; }

function spawnBurst(x, y, n) {
  for (let i=0;i<n;i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*220,
      vy: -Math.random()*260,
      life: 0.5 + Math.random()*0.3,
      t: 0,
      c: Math.random() < 0.5 ? '#f5c518' : '#ffffff'
    });
  }
}

function bindPress(el, downFn, upFn) {
  el.addEventListener('mousedown', (e) => { e.preventDefault(); downFn(); });
  el.addEventListener('touchstart', (e) => { e.preventDefault(); downFn(); }, {passive:false});
  if (upFn) {
    el.addEventListener('mouseup', upFn);
    el.addEventListener('mouseleave', upFn);
    el.addEventListener('touchend', upFn);
  }
}
bindPress(jumpBtn, doJump);
bindPress(boostBtn, startBoost, endBoost);

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); doJump(); }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyB') {
    e.preventDefault();
    if (!boostHeld) startBoost();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyB') endBoost();
});

startBtn.addEventListener('click', () => {
  goFullscreenLandscape();
  showStart(false);
  resetGame();
  running = true;
});

function showStart(show, title, text, btnLabel, showIdle) {
  if (showIdle === undefined) showIdle = true;
  if (show) {
    overlay.classList.remove('hidden');
    if (title) overlayTitle.textContent = title;
    if (text) overlayText.textContent = text;
    startBtn.textContent = btnLabel || 'PLAY';
    if (showIdle) {
      idleImg.parentElement.classList.remove('hidden');
      startIdleAnim();
    } else {
      idleImg.parentElement.classList.add('hidden');
      stopIdleAnim();
    }
  } else {
    overlay.classList.add('hidden');
    stopIdleAnim();
  }
}

function endGame() {
  gameOver = true;
  running = false;
  best = Math.max(best, Math.floor(score));
  // idle animation is only prepared for the Home screen, so the Game Over screen skips it
  showStart(true, 'GAME OVER', 'Оноо: ' + Math.floor(score) + '   |   Дээд оноо: ' + best, 'Дахин эхлэх', false);
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;
  update(dt, now);
  draw();
  requestAnimationFrame(loop);
}

function update(dt, now) {
  if (!running || gameOver) return;

  groundY = H * GROUND_Y_RATIO;

  if (boostHeld && now - holdStart > 120) { boosting = true; }
  if (!boostHeld) boosting = false;

  const curSpeed = boosting ? BOOST_SPEED : BASE_SPEED;
  speed += (curSpeed - speed) * Math.min(1, dt * 6);

  let g = GRAVITY;
  if (boosting && !player.onGround) {
    player.vy += (g + BOOST_LIFT) * dt;
  } else {
    player.vy += g * dt;
  }
  player.y += player.vy * dt;

  if (player.y + PLAYER_H >= groundY) {
    player.y = groundY - PLAYER_H;
    if (!player.onGround && player.vy > 200) {
      spawnBurst(player.x + playerW()*0.3, groundY, 8);
    }
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  if (player.y < 10) { player.y = 10; player.vy = Math.max(player.vy, 0); }

  player.rot = Math.max(-0.5, Math.min(0.5, player.vy / 1400));

  spawnTimer += dt * 1000;
  if (spawnTimer > nextSpawnGap) {
    spawnTimer = 0;
    nextSpawnGap = 700 + Math.random() * 700 - Math.min(300, score*1.2);
    nextSpawnGap = Math.max(420, nextSpawnGap);
    spawnObstacle();
  }

  for (const o of obstacles) { o.x -= speed * dt; }
  obstacles = obstacles.filter(o => o.x + o.w > -20);

  const pw = playerW();
  const pLeft = player.x + pw*0.17, pRight = player.x + pw - pw*0.17;
  const pBottom = player.y + PLAYER_H - 6;
  for (const o of obstacles) {
    const oTop = groundY - o.h;
    if (pRight > o.x && pLeft < o.x + o.w && pBottom > oTop) {
      endGame();
      break;
    }
  }

  for (const p of particles) {
    p.t += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 700 * dt;
  }
  particles = particles.filter(p => p.t < p.life);

  score += dt * (boosting ? 18 : 10);
  hud.textContent = Math.floor(score);

  world.dist += speed * dt;

  if (boosting && Math.random() < 0.6) {
    particles.push({
      x: player.x - 4, y: player.y + PLAYER_H - 6,
      vx: -speed*0.4 - Math.random()*60, vy: (Math.random()-0.5)*60,
      life: 0.25, t: 0, c: Math.random()<0.5 ? '#ff8a3d' : '#ffd23f'
    });
  }
}

function drawBackgroundParallax() {
  ctx.save();
  const t = world.dist;
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let i=0;i<6;i++) {
    const x = (W - ((t*0.05 + i*260) % (W+300)));
    ctx.beginPath();
    ctx.arc(x, 60 + (i%3)*30, 22, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawGround() {
  ctx.save();
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.strokeStyle = 'rgba(245,197,24,0.55)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(245,197,24,0.18)';
  ctx.lineWidth = 2;
  const seg = 46;
  const off = (world.dist) % seg;
  for (let x = -off; x < W; x += seg) {
    ctx.beginPath();
    ctx.moveTo(x, groundY + 6);
    ctx.lineTo(x + 24, groundY + 6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawObstacles() {
  for (const o of obstacles) {
    if (o.type === 'spike') {
      ctx.save();
      const grad = ctx.createLinearGradient(o.x, groundY-o.h, o.x, groundY);
      grad.addColorStop(0, '#ff5d5d');
      grad.addColorStop(1, '#b32020');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(o.x, groundY);
      ctx.lineTo(o.x + o.w/2, groundY - o.h);
      ctx.lineTo(o.x + o.w, groundY);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.save();
      const grad = ctx.createLinearGradient(o.x, groundY - o.h, o.x, groundY);
      grad.addColorStop(0, '#6f7bd6');
      grad.addColorStop(1, '#3c4590');
      ctx.fillStyle = grad;
      ctx.fillRect(o.x, groundY - o.h, o.w, o.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.strokeRect(o.x, groundY - o.h, o.w, o.h);
      ctx.restore();
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawBoard() {
  const bw = boardW();
  const bh = boardH();
  const pivot = footPivot();
  ctx.save();
  ctx.translate(pivot.x, pivot.y);
  ctx.rotate(player.rot * 0.6);

  // boost glow behind the board
  if (boosting) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    const glow = ctx.createRadialGradient(0, bh*0.2, 2, 0, bh*0.2, bw*0.65);
    glow.addColorStop(0, '#ffd23f');
    glow.addColorStop(1, 'rgba(255,138,61,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.ellipse(0, bh*0.2, bw*0.65, bh*1.8, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // board sits just below the pivot, its top edge touching the sprite's feet
  if (boardImg.complete && boardImg.naturalWidth > 0) {
    ctx.drawImage(boardImg, -bw/2, -bh*0.25, bw, bh);
  } else {
    ctx.fillStyle = boosting ? '#ffb648' : '#6b7a3f';
    ctx.fillRect(-bw/2, -bh*0.25, bw, bh);
  }
  ctx.restore();
}

function drawPlayer() {
  const pw = playerW();
  const pivot = footPivot();
  ctx.save();
  ctx.translate(pivot.x, pivot.y);
  ctx.rotate(player.rot);
  if (sprite.complete && sprite.naturalWidth > 0) {
    // pivot is at the sprite's feet, so draw the image extending upward from (0,0)
    ctx.drawImage(sprite, -pw/2, -PLAYER_H, pw, PLAYER_H);
  } else {
    ctx.fillStyle = '#444';
    ctx.fillRect(-pw/2, -PLAYER_H, pw, PLAYER_H);
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0,0,W,H);
  drawBackgroundParallax();
  drawGround();
  drawObstacles();
  drawParticles();
  drawBoard();
  drawPlayer();
}

resetGame();
showStart(true);
requestAnimationFrame(loop);
</script>
</body>
</html>
